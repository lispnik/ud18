# Run the ud18 protocol suite, on Linux and macOS.
#
# The repository is split along the platform seam so that this is possible:
# ud18/core is framing, checksums, measurement decoding and the command set,
# and depends only on ble/core, which has no dependencies of its own and
# touches no radio.  The suite depends on that core alone, so it needs no
# Bluetooth stack and no adapter, and it runs on a Mac exactly as it runs on
# the Pi that has the hardware.  Everything under ud18/ble is Linux-only and
# is not built here -- a job with no radio could not say anything about it.
#
# `ble\' is a sibling checkout rather than a vendored dependency because it is
# ours (github.com/lispnik/ble) and ocicl has nothing to fetch.  The two
# checkouts below reproduce the layout the Makefile expects, which is why
# BLE_DIR is ../ble.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: sbcl · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: ud18

    steps:
      - uses: actions/checkout@v5
        with:
          path: ud18

      - name: Check out ble, the shared BLE library
        uses: actions/checkout@v5
        with:
          repository: lispnik/ble
          path: ble

      - name: Install SBCL
        run: |
          set -eux
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install sbcl
          else
            sudo apt-get update
            sudo apt-get install -y sbcl
          fi
          sbcl --version

      - name: Install and configure ocicl
        # The clone and the setup each get a watchdog and three attempts.  A
        # hang here would otherwise sit until the job timeout having run no
        # tests at all; macOS ships no timeout(1), hence the watchdog.
        run: |
          attempt_with_timeout() {
            local secs=$1; shift
            ( "$@" ) & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local watchdog=$!
            local rc=0; wait "$pid" || rc=$?
            kill -9 "$watchdog" 2>/dev/null || true
            return $rc
          }
          clone_ocicl() {
            rm -rf "$HOME/ocicl-src"
            git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          }
          setup_ocicl() {
            ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          }
          for attempt in 1 2 3; do
            if attempt_with_timeout 300 clone_ocicl && attempt_with_timeout 300 setup_ocicl; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::ocicl could not be installed after 3 attempts" >&2
              exit 1
            fi
            echo "::warning::ocicl install attempt $attempt failed or hung; retrying"
            sleep 15
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        # ocicl exits 0 when a download fails and ghcr.io fails often enough to
        # matter, so the log is the thing to test and a failure belongs here,
        # on the line that names the package, rather than two steps later as
        # "Component not found".
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup
          for attempt in 1 2 3 4 5; do
            ocicl install 2>&1 | tee ocicl-install.log
            if ! grep -q "failed to install" ocicl-install.log; then
              break
            fi
            echo "::warning::ocicl install attempt $attempt did not get every package"
            sleep 30
          done
          if grep -q "failed to install" ocicl-install.log; then
            echo "::error::ocicl could not install every dependency after 5 attempts" >&2
            exit 1
          fi

      - name: Run the protocol suite
        # `make test\' already builds a hermetic source registry -- this tree,
        # its vendored ocicl/ deps, and exactly one directory of the sibling
        # checkout -- so the Makefile is the thing to run rather than a
        # hand-written command that could drift from it.
        run: make test BLE_DIR=../ble
